name: Check published examples
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate inactive templates and sample response
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request
          for path in pathlib.Path('workflows').glob('*.json'):
              data=json.loads(path.read_text())
              assert data['active'] is False
              assert all('credentials' not in node for node in data['nodes'])
              names={node['name'] for node in data['nodes']}
              for origin, ports in data['connections'].items():
                  assert origin in names
                  for branch in ports['main']:
                      assert all(edge['node'] in names for edge in branch)
              print('Valid structure:',path)
          url='https://job-change-feed.euticus.chatgpt.site/api/sample?source=ashby'
          with urllib.request.urlopen(url,timeout=30) as response:
              data=json.load(response)
          assert data['kind']=='current_sample' and 0 < len(data['rows']) <= 5
          print('Public sample returns a valid response; this does not test paid fulfillment.')
          PY
